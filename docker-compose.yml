services:
  db:
    image: postgis/postgis:18-3.6
    container_name: stroy-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - stroy_pgdata:/var/lib/postgresql
    restart: unless-stopped

volumes:
  stroy_pgdata:
